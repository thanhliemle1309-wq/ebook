<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#263d35">
  <title>Tích lũy tư bản — Ebook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="./main.js" defer></script>
</head>
<body>
  <main class="reader">
    <header class="reader-heading">
      <p class="eyebrow">EBOOK HỌC TẬP · KINH TẾ CHÍNH TRỊ</p>
      <h1>Tích lũy tư bản</h1>
      <p class="subheading">Khái niệm · Nhân tố ảnh hưởng · Hệ quả</p>
    </header>
    <section class="stage" aria-label="Sách điện tử">
      <button class="nav-button prev" id="prev" aria-label="Trang trước" title="Trang trước">‹</button>
      <div id="book" class="book" aria-live="polite"></div>
      <button class="nav-button next" id="next" aria-label="Trang tiếp theo" title="Trang tiếp theo">›</button>
    </section>
    <footer class="reader-controls">
      <span id="page-indicator">Bìa sách</span>
      <div class="progress-track"><div id="progress"></div></div>
      <div class="control-actions">
        <button id="first" class="text-button">Trang đầu</button>
        <button id="last" class="text-button">Trang cuối</button>
      </div>
      <p class="hint">Dùng nút mũi tên hoặc phím ← → để lật trang</p>
    </footer>
  </main>
</body>
</html>
